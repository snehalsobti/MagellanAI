<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A3358"/>
      <stop offset="100%" stop-color="#0D1B2F"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8C55E"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bg)" stroke="#C9A84C" stroke-width="1.5" opacity="0.9"/>
  <!-- Compass rose - main points -->
  <!-- North (gold) -->
  <polygon points="64,8 68,54 60,54" fill="url(#gold)"/>
  <!-- South -->
  <polygon points="64,120 68,74 60,74" fill="#7395B8" opacity="0.8"/>
  <!-- East -->
  <polygon points="120,64 74,60 74,68" fill="#7395B8" opacity="0.8"/>
  <!-- West -->
  <polygon points="8,64 54,60 54,68" fill="#7395B8" opacity="0.8"/>
  <!-- Diagonal points (smaller) -->
  <polygon points="64,8 101,27 74,54" fill="#C9A84C" opacity="0.5" transform="rotate(45 64 64)"/>
  <polygon points="64,8 101,27 74,54" fill="#7395B8" opacity="0.25" transform="rotate(135 64 64)"/>
  <polygon points="64,8 101,27 74,54" fill="#7395B8" opacity="0.25" transform="rotate(225 64 64)"/>
  <polygon points="64,8 101,27 74,54" fill="#C9A84C" opacity="0.5" transform="rotate(315 64 64)"/>
  <!-- Center circles -->
  <circle cx="64" cy="64" r="10" fill="#0D1B2F" stroke="#C9A84C" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="4" fill="url(#gold)"/>
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.35"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="#1E3352" stroke-width="0.6" opacity="0.6"/>
</svg>
